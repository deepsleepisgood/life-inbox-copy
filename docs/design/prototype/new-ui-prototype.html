<!doctype html>
<!--
  PROTOTYPE: throwaway, not production code. Do not link from the app.
  Question it answers: "What should the redesigned Life Inbox home look like?"
  Three structurally different arrangements of the agreed three-pane idea,
  switchable with ?variant=A|B|C (floating bar at the bottom, or the arrow keys):
    A  Three panes: features left, composer + content centre, bots right (owner's pick;
       revised: fits the window, no dead space, home is a card grid, topics pack as masonry)
    B  Captain conversation: chat-style centre, features rail left, "studio" view panel right
    C  Today focus: one calm centre column, features and bots as slim rails that open sheets
  Data is the owner's real sample notes, hard-coded. Nothing is saved; reload resets it.
  Life bots are the five areas from docs/research-life-categories.md, 3 default topics each,
  filed by rules R1-R6; an unclear note waits in Captain's "Needs you" (no catch-all topic).
  Styling copies the calm "Enter your Life" login palette (powder blue, lavender, soft red).
-->

const ic=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${I[n]}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------------------------------------------------------------- data (owner's real sample notes)

// Python and Pill reminder are the owner's own subtopics, showing users can add more.
const BOTS={
 learn:{n:'Learning & work',i:'learn',c:'#dcd3f7',fg:'#463a7c',topics:['Study','Python','Work & career','Skills & projects']},
 money:{n:'Money & home',i:'money',c:'#fdf1d8',fg:'#8a5a00',topics:['Bills & subscriptions','Bank, tax & documents','Home & errands']},
 health:{n:'Health',i:'health',c:'#fbe3e6',fg:'#9f2a35',topics:['Medicines & doctors','Pill reminder','Fitness & food','Mind & mood']},
 people:{n:'People',i:'people',c:'#e3f4ea',fg:'#1f6b3f',topics:['Family','Friends & partner','Occasions & gifts']},
 fun:{n:'Fun & interests',i:'fun',c:'#e3edfb',fg:'#2f5e9e',topics:['Watch, read & listen','Cooking & hobbies','Trips & places']}};
const TOPICS={'Study':{bot:'learn',parent:null,d:'Courses, exams, assignments, college life'},'Python':{bot:'learn',parent:'Study',d:'I want to learn Python'},
 'Work & career':{bot:'learn',parent:null,d:'Job or internship tasks, meetings, interviews'},'Skills & projects':{bot:'learn',parent:null,d:'Tutorials, tools to try, side projects, app ideas'},
 'Bills & subscriptions':{bot:'money',parent:null,d:'Rent, bills, EMIs, subscriptions, fees'},'Bank, tax & documents':{bot:'money',parent:null,d:'Savings, tax, insurance, IDs, warranties'},'Home & errands':{bot:'money',parent:null,d:'Groceries, shopping, chores, repairs, pets'},
 'Medicines & doctors':{bot:'health',parent:null,d:'Pills, refills, appointments, tests'},'Pill reminder':{bot:'health',parent:'Medicines & doctors',d:'When to take which pills'},
 'Fitness & food':{bot:'health',parent:null,d:'Workouts, sport, sleep, diet'},'Mind & mood':{bot:'health',parent:null,d:'Stress, therapy, meditation, journaling'},
 'Family':{bot:'people',parent:null,d:'Parents, siblings, kids: needs and plans'},'Friends & partner':{bot:'people',parent:null,d:'Catch-ups, people to call or message'},'Occasions & gifts':{bot:'people',parent:null,d:'Birthdays, dates, weddings, parties, gifts'},
 'Watch, read & listen':{bot:'fun',parent:null,d:'Shows, films, books, podcasts, videos'},'Cooking & hobbies':{bot:'fun',parent:null,d:'Recipes to try, games, crafts'},'Trips & places':{bot:'fun',parent:null,d:'Holidays, bookings, packing, places to visit'}};
// rule = the boundary rule (R1-R6) that decided the area; shown under "Why it's here".
// status 'needs' = Captain wasn't sure (R6): the note waits in "Needs you" with its choices.
let ITEMS=[
 {id:1,title:'Take Python quiz',topic:'Python',type:'Note',pri:'hi',date:'2026-11-03',time:'11:00',conf:'note',note:null,src:'I need to give Python quiz tomorrow at 11:00am',why:'Explicit exam tomorrow at 11:00',rule:'R5 · the subject decides: a course quiz',status:'open'},
 {id:2,title:'Make white sauce pasta',topic:'Occasions & gifts',type:'Link',pri:'hi',date:null,sug:'2026-11-07',fuzzy:'coming saturdy',note:'I want to make White Sauce Pasta for my Date on coming saturdy.',src:'youtube.com · Kabita\'s Kitchen · creamy white sauce pasta recipe',why:'Planned for a date on Saturday',rule:'R3 · your purpose beats the content: it\'s a recipe, but it\'s "for my Date"',status:'open'},
 {id:3,title:'Talk to Admin about Halloween budget',topic:'Study',type:'Image',pri:'hi',date:null,note:'I have to talk to Admin team of my college about budget for Halloween event.',src:'Halloween final Mail communication image.png (text not readable yet)',why:'Discussion needed about an event budget',rule:'R4 · it\'s the college\'s budget, not your money',status:'open'},
 {id:4,title:'Practice Statistics hypothesis testing',topic:'Study',type:'PDF',pri:'md',date:null,note:'These are the questions I need to practice for Statistics.',src:'8 PP - Hypothesis Testing.pdf',why:'Practice to do, no deadline',rule:'R3 · your note says it\'s "for Statistics"',status:'open'},
 {id:5,title:'Cancel Netflix subscription',topic:'Bills & subscriptions',type:'Note',pri:'md',date:'2026-12-15',conf:'note',note:null,src:'I need to cancel my Netflix subscription on 15th December 2026',why:'Scheduled, not urgent yet',rule:'R2 · cancelling a subscription is a money task, even for a show',status:'open'},
 {id:6,title:'Butter chicken recipe',topic:'Cooking & hobbies',type:'Note',pri:'lo',date:null,note:null,src:'Butter chicken: marinate 500 g chicken in yogurt, ginger-garlic paste…',why:'Saved for someday',rule:'R5 · a recipe to try, with no occasion',status:'open'},
 {id:7,title:'Nemotron AI coding agent video',topic:null,choices:['Skills & projects','Watch, read & listen'],type:'Link',pri:'lo',date:null,note:null,src:'youtube.com · The free AI coding agent you need to try',why:'A coding-tool video saved without a note',hint:'saved without a note',rule:'R6 · two areas fit equally, so Captain asks instead of guessing',status:'needs'}];
const MEMORY={learn:[['Student, learning Python and Statistics','notes #1, #4'],['Organises a college Halloween event','note #3'],['Python quiz on Tue 3 Nov, 11:00','note #1 (time memory)']],
 money:[['Tracks subscriptions to cancel','note #5'],['Netflix cancel on 15 Dec','note #5 (time memory)']],
 health:[], people:[['Date night planned for Saturday','note #2 (time memory, unconfirmed)']], fun:[['Likes cooking Indian food and pasta','notes #2, #6']]};
const TODAY=new Date(2026,10,2);
let S={variant:new URLSearchParams(location.search).get('variant')||'A',lens:null,view:'home',topicPage:null,sheet:null,askLog:[],attach:null,scout:{done:{}},notice:null,studio:'calendar'};
const botOf=it=>TOPICS[it.topic]?.bot;
const vis=()=>ITEMS.filter(it=>it.status==='open'&&(!S.lens||botOf(it)===S.lens));
const fmt=d=>{if(!d)return'';const x=new Date(d+'T00:00');return x.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})};
const pathOf=t=>{const tp=TOPICS[t];return tp.parent?[tp.parent,t]:[t]};
const priLabel={hi:'High',md:'Medium',lo:'Low'};
const needs=()=>{const n=[];ITEMS.filter(i=>i.status==='open'&&i.fuzzy&&!i.date).forEach(i=>n.push({k:'date',i}));ITEMS.filter(i=>i.status==='needs').forEach(i=>n.push({k:'area',i}));ITEMS.filter(i=>i.status==='open'&&i.id===3&&!i.date).forEach(i=>n.push({k:'nodate',i}));if(!S.statDone)n.push({k:'topic'});return n};
const scoutQs=[{id:3,q:'Halloween was on 31 Oct. Still need to talk to Admin about the budget?'},{id:6,q:'You saved the butter chicken recipe 2 days ago. Still planning to make it?'}];

// ---------------------------------------------------------------- shared pieces
function datePill(it){if(it.date)return `<button class="chip" data-act="date" data-id="${it.id}" title="${it.conf==='you'?'Confirmed by you':'From your note'}">${ic('calendar',12)} ${fmt(it.date)}${it.time?' · '+it.time:''}${it.conf==='you'?' ✓':''}</button>`;

 <span style="flex:1"></span><span class="mut" id="cc">0 / 2000</span><button class="btn" data-act="add">${S.attach?'Add '+S.attach.kind.toLowerCase()+' with note':'Add note'}</button></div></div>`}
function lensChip(){return S.lens?`<span class="lens">Viewing: ${BOTS[S.lens].n} <button data-act="lens" data-b="" aria-label="Show everything">×</button></span>`:`<span class="mut">Showing everything</span>`}
function botsList(){const items=[['captain','Captain','crown','#efeafd','#463a7c',needs().length],['scout','Scout','scout','#dff1f5','#1f6170',scoutQs.filter(q=>!S.scout.done[q.id]).length]];

 <div class="sec">Life bots</div>${Object.entries(BOTS).map(([k,b])=>{const n=ITEMS.filter(i=>i.status==='open'&&botOf(i)===k).length;return `<button class="bot ${S.lens===k?'on':''}" data-act="lens" data-b="${k}"><span class="bico" style="background:${b.c};color:${b.fg}">${ic(b.i)}</span><span>${b.n}</span>${n?`<span class="badge" style="background:var(--lav);color:var(--lav-deeper)">${n}</span>`:''}</button>`}).join('')}`}
const FEATS=[['topics','Topics and spaces','topics'],['timeline','Timeline','timeline'],['calendar','Calendar','calendar'],['priority','Priority','flag'],['dashboard','Dashboard','dash'],['ask','Ask me','ask']];

// ---------------------------------------------------------------- views
function vCaptain(){const n=needs();const open=vis();const hi=open.filter(i=>i.pri==='hi');
 return `<div class="glass" style="padding:18px 20px"><div style="display:flex;align-items:center;gap:10px"><span class="bico" style="background:#efeafd;color:#463a7c">${ic('crown')}</span><h2 class="h2">Good evening. Here's your life today.</h2></div>
 <p style="line-height:1.65;margin:10px 0 0">Your <b>Python quiz is tomorrow at 11:00</b>, the most urgent thing. ${hi.length} high-priority items are open, and ${n.length} things need a quick answer from you.</p>
 <div class="sec" style="margin-left:0">Needs you</div>${n.map(needCard).join('')||'<div class="mut">Nothing needs you. Enjoy your evening.</div>'}
 <div class="sec" style="margin-left:0">Today's focus</div>${open.filter(i=>i.pri==='hi').slice(0,3).map(itemRow).join('')}</div>`}
function areaButtons(it){return it.choices?it.choices.map(t=>`<button class="btn2" data-act="area" data-id="${it.id}" data-t="${esc(t)}" title="${esc(BOTS[TOPICS[t].bot].n)}">${esc(t)}</button>`).join(' '):Object.entries(BOTS).map(([k,b])=>`<button class="chip" data-act="areabot" data-id="${it.id}" data-b="${k}" style="background:${b.c};color:${b.fg};margin:0 4px 4px 0">${esc(b.n)}</button>`).join('')}
function needCard(x){if(x.k==='area')return `<div class="need"><div><b style="font-weight:600">${esc(x.i.title)}</b> <span class="mut">· ${esc(x.i.hint||'not sure where it goes')}</span></div><div class="mut" style="margin:4px 0 8px">${x.i.choices?'Two areas fit equally, so Captain won\'t guess. Which is it?':'Captain couldn\'t tell which area this belongs to. Pick one:'}</div>${areaButtons(x.i)}</div>`;
 if(x.k==='date')return `<div class="need warn"><div><b style="font-weight:600">${esc(x.i.title)}</b> <span class="mut">· you wrote "${esc(x.i.fuzzy)}"</span></div><div class="mut" style="margin:4px 0 8px">Which day exactly? Captain suggests ${fmt(x.i.sug)}.</div><button class="btn2" data-act="date" data-id="${x.i.id}">${ic('calendar',14)} Set date</button></div>`;
 if(x.k==='nodate')return `<div class="need"><div><b style="font-weight:600">${esc(x.i.title)}</b> has no date</div><div class="mut" style="margin:4px 0 8px">Halloween is over. Keep it with a date, or drop it?</div><button class="btn2" data-act="date" data-id="3">Set date</button> <button class="btn2" data-act="dropit" data-id="3">Drop it</button></div>`;
 return `<div class="need"><div>${ic('spark',14)} <b style="font-weight:600">Learning &amp; work bot suggests: Statistics, under Study</b></div><div class="mut" style="margin:4px 0 8px">Based on your Hypothesis Testing PDF and your note "practice for Statistics".</div><button class="btn2" data-act="mkstat">Create it</button> <button class="btn2" data-act="nostat">Not now</button></div>`}
function vTopics(){if(S.topicPage)return vTopicPage(S.topicPage);
 const groups=Object.entries(BOTS).filter(([k])=>!S.lens||k===S.lens);const total=ITEMS.filter(i=>i.status==='open').length;
 const count=t=>ITEMS.filter(i=>i.status==='open'&&(i.topic===t||TOPICS[i.topic].parent===t)).length;
 const groupHtml=([k,b])=>{const mains=b.topics.filter(t=>!TOPICS[t].parent).sort((x,y)=>count(y)-count(x));const n=ITEMS.filter(i=>i.status==='open'&&botOf(i)===k).length;
  return `<div class="card group"><div class="cardHead"><span class="bico" style="background:${b.c};color:${b.fg}">${ic(b.i)}</span><div><h2 class="h2">${b.n}</h2><div class="mut">${n} item${n===1?'':'s'}</div></div></div>
  ${mains.map(t=>{const subs=Object.keys(TOPICS).filter(s=>TOPICS[s].parent===t);const c=count(t);
   return `<button class="trow ${c?'':'empty'}" data-act="topic" data-t="${t}"><div style="min-width:0"><div>${esc(t)}</div><div class="mut" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(TOPICS[t].d)}</div></div><span class="count">${c}</span></button>
   ${subs.map(s=>`<button class="trow sub ${ITEMS.some(i=>i.status==='open'&&i.topic===s)?'':'empty'}" data-act="topic" data-t="${s}">↳ ${esc(s)}<span class="mut" style="margin-left:auto">${ITEMS.filter(i=>i.status==='open'&&i.topic===s).length}</span></button>`).join('')}`}).join('')}</div>`};
 const ordered=[...groups].sort((a,b)=>ITEMS.filter(i=>i.status==='open'&&botOf(i)===b[0]).length-ITEMS.filter(i=>i.status==='open'&&botOf(i)===a[0]).length);
 return `<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px"><h2 class="h2">Topics and spaces</h2><span class="mut">${total} items in ${Object.keys(TOPICS).length} topics · busiest areas first${ITEMS.some(i=>i.status==='needs')?` · ${ITEMS.filter(i=>i.status==='needs').length} waiting in Needs you`:''}</span><button class="btn2" data-act="toast" data-m="Prototype: opens the name + description form with the subtopic suggestion. Each area starts with 3 topics; add as many as you like." style="margin-left:auto">+ New topic</button></div>
 <div class="masonry">${ordered.map(groupHtml).join('')}<div class="card group ghost"><div class="cardHead">${ic('spark')}<h2 class="h2">Add your own topic</h2></div><div class="mut" style="line-height:1.5">Every area starts with 3 topics. Add as many topics and subtopics as you like, such as Study › Python.</div><button class="btn2" data-act="toast" data-m="Prototype: opens the name + description form with the subtopic suggestion" style="margin-top:10px">+ New topic</button></div></div>`}
function vTopicPage(t){const subs=Object.keys(TOPICS).filter(s=>TOPICS[s].parent===t);const its=ITEMS.filter(i=>i.status==='open'&&(i.topic===t||TOPICS[i.topic].parent===t));const b=BOTS[TOPICS[t].bot];
 return `<button class="link mut" data-act="topicsback">${ic('back',14)} All topics</button>
 <div class="mut" style="margin-top:10px">${b.n} bot › ${pathOf(t).map(x=>`<button class="link mut" data-act="topic" data-t="${x}">${esc(x)}</button>`).join(' › ')}</div>
 <h2 class="h1" style="margin:4px 0">${esc(t)}</h2><p class="mut" style="margin:0 0 10px">${esc(TOPICS[t].d)} · ${its.length} items</p>
 ${subs.length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">${subs.map(s=>`<button class="chip" data-act="topic" data-t="${s}">${esc(s)} · ${ITEMS.filter(i=>i.status==='open'&&i.topic===s).length}</button>`).join('')}</div>`:''}
 ${its.map(itemRow).join('')||'<p class="mut">Nothing here yet. Notes about this land here automatically.</p>'}`}
function weekDays(){return [...Array(7)].map((_,k)=>`2026-11-${String(2+k).padStart(2,'0')}`)}
function vTimeline(){const days=weekDays();const its=vis();const undated=its.filter(i=>!i.date).length;
 return `<h2 class="h2">Timeline · this week</h2><p class="mut">How heavy is your week? Spikes show what's due. Undated: ${undated} · <button class="link mut" data-act="captain" style="text-decoration:underline">sort them with Captain</button></p>
 <div style="position:relative;height:170px;margin:16px 6px 0"><div style="position:absolute;left:0;right:0;top:120px;border-top:2px solid var(--lav-mid)"></div>
 ${days.map((d,k)=>{const due=its.filter(i=>i.date===d||(!i.date&&i.sug===d));const x=(k+.5)/7*100;const isT=d==='2026-11-02';
 return `<div style="position:absolute;left:calc(${x}% - 30px);width:60px;top:0;height:120px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px">${due.map(i=>`<button data-act="open" data-id="${i.id}" title="${esc(i.title)}" style="width:22px;height:${i.pri==='hi'?54:34}px;border:0;border-radius:8px 8px 3px 3px;background:${i.date?BOTS[botOf(i)].fg:'transparent'};outline:${i.date?'none':'2px dashed '+BOTS[botOf(i)].fg}"></button>`).join('')}</div>
 <div style="position:absolute;left:calc(${x}% - 30px);width:60px;top:128px;text-align:center;font-size:12px;${isT?'color:var(--lav-deep);font-weight:700':'color:var(--ink-soft)'}">${fmt(d).split(' ').slice(0,2).join(' ')}${isT?'<br>today':''}</div>`}).join('')}</div>
 <div class="sec" style="margin-left:0">Due this week</div>${its.filter(i=>days.includes(i.date)||days.includes(!i.date&&i.sug)).map(itemRow).join('')||'<p class="mut">Nothing dated this week.</p>'}`}
function vCalendar(){let g='';['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d=>g+=`<div class="mut" style="text-align:center">${d}</div>`);g+='<div></div>'.repeat(6);const its=vis();
 for(let d=1;d<=30;d++){const ds=`2026-11-${String(d).padStart(2,'0')}`;const on=its.filter(i=>i.date===ds||(!i.date&&i.sug===ds));g+=`<button class="day ${d===2?'today':''}" data-act="day" data-d="${ds}"><b style="font-weight:600">${d}</b><br>${on.map(i=>`<span class="dot" style="background:${BOTS[botOf(i)].fg};${i.date?'':'background:transparent;outline:1.5px dashed '+BOTS[botOf(i)].fg}"></span>`).join('')}</button>`}
 return `<h2 class="h2">November 2026</h2><p class="mut">Solid dot = date confirmed · dashed = suggested. Click a day.</p><div class="cal" style="position:relative">${g}</div><div id="daypop"></div>`}
function vPriority(){const c=p=>vis().filter(i=>i.pri===p).map(i=>`<button class="tcard" data-act="open" data-id="${i.id}"><div>${esc(i.title)}</div><div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap"><span class="chip" style="background:${BOTS[botOf(i)].c};color:${BOTS[botOf(i)].fg}">${BOTS[botOf(i)].n}</span><span class="mut">${i.date?fmt(i.date):'No date'}</span></div><div class="mut" style="margin-top:4px">Why: ${esc(i.why)}</div></button>`).join('')||'<p class="mut">Nothing</p>';
 return `<h2 class="h2">Priority</h2><p class="mut">Today and the next few first. Drag a card to another column to change it (prototype: click opens).</p><div class="cols"><div class="col"><span class="pri p-hi">High</span>${c('hi')}</div><div class="col"><span class="pri p-md">Medium</span>${c('md')}</div><div class="col"><span class="pri p-lo">Low</span>${c('lo')}</div></div>`}
function vDashboard(){const per=Object.entries(BOTS).map(([k,b])=>[b.n,ITEMS.filter(i=>botOf(i)===k).length]);const max=Math.max(...per.map(p=>p[1]),1);const quiet=per.filter(p=>!p[1]).map(p=>p[0]);const top=[...per].sort((a,b)=>b[1]-a[1])[0];
 return `<h2 class="h2">Your life at a glance</h2><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px"><div class="metric"><span class="mut">Captured this week</span><b>${ITEMS.length}</b></div><div class="metric"><span class="mut">Tasks done</span><b>${ITEMS.filter(i=>i.status==='done').length} of ${ITEMS.length}</b></div><div class="metric"><span class="mut">Busiest day</span><b>Sat</b></div></div>
 <div class="sec" style="margin-left:0">Where your attention went</div>${per.map(p=>`<div style="display:flex;align-items:center;gap:10px;margin:7px 0"><span style="width:150px">${p[0]}</span><div class="bar" style="flex:1"><span style="width:${p[1]/max*100}%"></span></div><span class="mut">${p[1]}</span></div>`).join('')}
 <div class="sec" style="margin-left:0">Captain noticed</div><div class="row">${ic('spark',14)} You saved 2 recipes; one is planned for Saturday.</div>${quiet.length?`<div class="row">${ic('spark',14)} ${quiet.join(' and ')} ${quiet.length>1?'have':'has'} been quiet for 2 weeks.</div>`:''}<div class="row">${ic('spark',14)} ${top[0]} is your busiest area: ${top[1]} of ${ITEMS.length} notes.</div>`}
function vBot(k){const b=BOTS[k];const its=vis();const mem=MEMORY[k];
 const summ={learn:'Python quiz tomorrow at 11:00 is your most urgent item. Statistics practice and the Halloween budget talk are waiting without dates.',money:'One subscription to cancel: Netflix on 15 Dec. Bills, documents and home errands collect here.',health:'No health items yet. Pill reminder is set up but empty.',people:'Date night on Saturday: white sauce pasta (date not confirmed).',fun:'Butter chicken is saved for someday. No trips planned yet.'}[k];
 return `<div style="display:flex;align-items:center;gap:10px"><span class="bico" style="background:${b.c};color:${b.fg};width:40px;height:40px">${ic(b.i,22)}</span><div><h2 class="h1">${b.n} bot</h2><div class="mut">Looks after: ${b.topics.filter(t=>!TOPICS[t].parent).join(' · ')}</div></div></div>
 <p style="line-height:1.65">${summ}</p><div class="sec" style="margin-left:0">What you need to do</div>${its.map(itemRow).join('')||'<p class="mut">Nothing to do here right now.</p>'}
 <div class="sec" style="margin-left:0">What I learned about you</div>${k==='health'?`<div class="need">Health memory is off. Health details are sensitive, so this bot only remembers them if you allow it. <div style="margin-top:8px"><button class="btn2" data-act="toast" data-m="Prototype: would ask for explicit consent">Allow health memory</button></div></div>`:(mem.map(m=>`<div class="row"><span style="flex:1">${esc(m[0])}</span><span class="mut">from ${m[1]}</span><button class="link mut" data-act="toast" data-m="Prototype: edit or delete this memory">Edit</button></div>`).join('')||'<p class="mut">Nothing learned yet.</p>')}
 <div class="mut" style="margin-top:12px">Tip: with this bot selected, every left-panel view shows only ${b.n.toLowerCase()} items.</div>`}
function vScout(){const qs=scoutQs.filter(q=>ITEMS.find(i=>i.id===q.id).status==='open'||S.scout.done[q.id]);
 return `<div style="display:flex;align-items:center;gap:10px"><span class="bico" style="background:#dff1f5;color:#1f6170;width:40px;height:40px">${ic('scout',22)}</span><div><h2 class="h1">Scout catch-up</h2><div class="mut">A minute to keep your inbox honest. Your answers update the bots' memory.</div></div></div>
 ${qs.map(q=>{const it=ITEMS.find(i=>i.id===q.id);const d=S.scout.done[q.id];return `<div class="need">${esc(q.q)}<div style="margin-top:4px">${crumb(it)}</div>${d?`<div style="margin-top:8px;color:var(--green)">${d}</div>`:`<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn2" data-act="scout" data-id="${q.id}" data-a="done">Done</button><button class="btn2" data-act="scout" data-id="${q.id}" data-a="later">Not yet, new date</button><button class="btn2" data-act="scout" data-id="${q.id}" data-a="drop">Drop it</button></div>`}</div>`}).join('')}
 ${S.notice?`<div class="how" style="margin-top:12px">${S.notice}</div>`:''}`}
// ---------------------------------------------------------------- Ask me
const ASK_SUG=['What do I have this week?','What am I cooking for my date?','Which video is for Python?','What did I save about money?'];
function answer(q){const t=q.toLowerCase();const lens=S.lens;const its=vis();const cite=i=>`<button class="cite" data-act="open" data-id="${i.id}">#${i.id}</button>`;
 const how=(bots,mem,notes)=>`<div class="how">How I answered: Captain asked <b>${bots}</b> · used ${mem} memory facts · read notes ${notes.map(i=>'#'+i.id).join(', ')||'none'} · answer uses only your notes</div>`;
 if(/week|this week|upcoming|due/.test(t)){const days=weekDays();const w=its.filter(i=>days.includes(i.date)||days.includes(!i.date&&i.sug));
  if(!w.length)return {a:`Nothing is dated this week${lens?' in '+BOTS[lens].n:''}. ${its.find(i=>i.date)?`Next up: ${esc(its.find(i=>i.date).title)} on ${fmt(its.find(i=>i.date).date)} ${cite(its.find(i=>i.date))}.`:''}`,h:how(lens?BOTS[lens].n:'all bots',2,[])};
  return {a:w.map(i=>`${esc(i.title)}: ${i.date?fmt(i.date)+(i.time?' at '+i.time:''):'probably '+fmt(i.sug)+' (you wrote "'+esc(i.fuzzy)+'", not confirmed yet)'} ${cite(i)}`).join('<br>')+(w.some(i=>!i.date)?`<div style="margin-top:8px"><button class="btn2" data-act="date" data-id="2">Confirm Saturday's date</button></div>`:''),h:how(lens?BOTS[lens].n:[...new Set(w.map(i=>BOTS[botOf(i)].n))].join(', '),3,w)}}
 if(/cook|date|recipe|pasta/.test(t)){const p=ITEMS.find(i=>i.id===2),bc=ITEMS.find(i=>i.id===6);if(lens&&lens!=='people'&&lens!=='fun')return {a:`I only looked in ${BOTS[lens].n} because that bot is selected, and there's nothing about cooking there. Clear the lens to search everything.`,h:how(BOTS[lens].n,0,[])};
  if(lens==='fun')return {a:`In Fun & interests: a butter chicken recipe saved for someday ${cite(bc)}. Your date-night pasta is filed under People, because your note says it's for a date. Clear the lens to see both.`,h:how(BOTS.fun.n,1,[bc])};
  return {a:`White sauce pasta ${cite(p)}. You saved a Kabita's Kitchen video and wrote that it's for your date on coming Saturday. ${p.date?'Date confirmed: '+fmt(p.date)+'.':'The date isn\'t confirmed yet.'}${lens?'':` You also saved a butter chicken recipe for someday ${cite(bc)}.`}`,h:how(lens?BOTS[lens].n:'People, Fun & interests',2,lens?[p]:[p,bc])}}
 if(/python/.test(t)){const v=ITEMS.find(i=>i.id===7);return {a:`None of your saved videos is marked as being for Python. The closest is the Nemotron AI coding agent video ${cite(v)}, but you didn't add a note linking it to Python, so I won't assume it.${v.status==='needs'?' It\'s waiting in Needs you for you to pick its area.':''} Your Python item is the quiz tomorrow at 11:00 ${cite(ITEMS.find(i=>i.id===1))}.`,h:how('Learning & work',2,[v,ITEMS.find(i=>i.id===1)])}}
 if(/money|bill|netflix|subscri/.test(t)){const n=ITEMS.find(i=>i.id===5);return {a:`One money item: cancel Netflix on ${fmt(n.date)} ${cite(n)}. The Money & home bot remembers you track subscriptions to cancel, so it will remind you a few days before.`,h:how('Money & home',1,[n])}}
 return {a:`I couldn't find that in your notes, so I won't guess. Try asking about your week, a topic, or a date.`,h:how(lens?BOTS[lens].n:'all bots',0,[])}}
function vAsk(){return `<h2 class="h2">Ask me</h2><p class="mut">Answers come only from your notes and memory, with links to the notes they used. ${S.lens?'Answering from '+BOTS[S.lens].n+' only.':'Answering from everything.'}</p>
 <div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0">${ASK_SUG.map(s=>`<button class="chip" data-act="ask" data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div>
 <div style="display:flex;flex-direction:column;gap:10px;margin:12px 0">${S.askLog.map(m=>m.me?`<div class="bubble b-me">${esc(m.me)}</div>`:`<div class="bubble b-ai">${m.a}${m.h}</div>`).join('')||'<p class="mut">Ask anything about your inbox.</p>'}</div>
 <div style="display:flex;gap:8px"><input id="askIn" placeholder="What did I plan for Saturday?" style="flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:#fff"><button class="btn" data-act="askgo">Ask</button></div>`}
function viewHtml(v){if(S.lens&&v==='home')return vBot(S.lens);return {home:vCaptain,topics:vTopics,timeline:vTimeline,calendar:vCalendar,priority:vPriority,dashboard:vDashboard,ask:vAsk,scout:vScout}[v]()}
// ---------------------------------------------------------------- item sheet (shared)
function itemSheet(id){const it=ITEMS.find(i=>i.id===id);const b=BOTS[botOf(it)];const rel=b?ITEMS.filter(i=>i.id!==id&&i.status==='open'&&(i.topic===it.topic||TOPICS[i.topic].parent===it.topic||TOPICS[it.topic].parent===i.topic)):[];
 return `<div class="sheet-bg" data-act="close"><div class="sheet" data-stop="1"><button class="link mut" data-act="close">${ic('x',14)} Close</button>
